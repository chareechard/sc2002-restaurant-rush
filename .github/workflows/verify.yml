name: Verify runnable stages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        stage: [stage-1, stage-2, current]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.stage == 'current' && github.sha || matrix.stage == 'stage-1' && 'work/stage-1' || 'work/stage-2' }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 test
      - name: Compile and test on Linux
        if: runner.os == 'Linux'
        run: sh build.sh test
      - name: Verify clean rebuild on Windows
        if: runner.os == 'Windows' && matrix.stage == 'current'
        shell: pwsh
        run: ./tools/verify-build.ps1
      - name: Verify clean rebuild on Linux
        if: runner.os == 'Linux' && matrix.stage == 'current'
        run: sh tools/verify-build.sh
      - name: Verify both CLI endings
        shell: bash
        run: |
          java -jar build/restaurant-rush.jar < replays/victory.txt > victory.txt
          java -jar build/restaurant-rush.jar < replays/defeat.txt > defeat.txt
          grep -q 'RESULT: VICTORY' victory.txt
          grep -q 'RESULT: DEFEAT' defeat.txt
          ! grep -q 'Invalid' victory.txt
          ! grep -q 'Invalid' defeat.txt
